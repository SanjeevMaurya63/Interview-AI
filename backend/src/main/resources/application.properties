server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/intervueai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Sanjeev@11
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring AI - Google Gemini Configuration
spring.ai.google.gemini.api-key=${GOOGLE_GENERATIVE_AI_API_KEY:}
spring.ai.google.gemini.model=gemini-2.0-flash

# JWT Configuration
jwt.secret=${JWT_SECRET:intervueai-secret-key-change-in-production-must-be-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:1209600000}
