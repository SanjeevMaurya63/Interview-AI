server.port=8080

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/intervueai?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API key for Google Gemini AI
gemini.api.key=${GOOGLE_GENERATIVE_AI_API_KEY:}

# Firebase Auth configuration (for session cookie verification only)
firebase.project.id=${FIREBASE_PROJECT_ID:}
firebase.client.email=${FIREBASE_CLIENT_EMAIL:}
firebase.private.key=${FIREBASE_PRIVATE_KEY:}
